    - fonte: "Gocat (736 modelos, 26 providers, 10 enabled)"
      status: "Em uso (10 modelos de 7 vendors)"
      modelos_ativos: ["command-r-plus-08-2024", "command-a-03-2025", "llama-3.3-70b-versatile", "qwen/qwen3.6-27b", "gemini-2.5-flash", "deepseek-ai/deepseek-v4-flash", "Meta-Llama-3.3-70B-Instruct", "tencent/hy3:free", "kilo-auto/free", "deepseek-ai/DeepSeek-V3"]
      providers_enabled: ["sambanova", "huggingface", "zai", "duckduckgo-web", "groq", "github", "gemini", "nvidia", "kilo", "cohere"]
