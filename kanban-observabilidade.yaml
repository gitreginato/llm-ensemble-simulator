  - id: 43
    titulo: "Integrar Kilo Code (kilocode) como fonte de LLM"
    coluna: DONE
    prioridade: media
    workflow: AUTORESEARCH
    estimativa: "30min"
    data_conclusao: "2026-07-20"
    descricao: |
      Kilo Code tem gateway proprio com 10 modelos free testados e funcionando.
