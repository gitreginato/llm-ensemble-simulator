    coluna: TODO
    prioridade: critica
    workflow: AUTORESEARCH
    estimativa: "2h"
    descricao: |
      Modelo de decisao probabilistico calibrado nos 142 personas reais.
      P(agendou) = sigmoid(w1*theft + w2*sem_seguranca + w3*budget_ok +
      w4*bairro_risco + w5*nicho_fit + w6*crisis_driven + w7*renovation + bias)
      Pesos w derivados por regressao logistica nos dados reais.
      Para cada persona, amostra da distribuicao (nao deterministico).
      Inclui: WTP por nicho (kernel density), objecoes (multinomial),
      sentimento e confianca (beta).
    arquivos: ["simulation_army_v2/modelo_probabilistico.py"]
    aceitacao:
