tarefas:

  # --- FASE 1: FIX BUGS CRITICOS ---

  - id: 36
    titulo: "Fix bug SQLite do gocat (ON CONFLICT clause)"
    coluna: DONE
    prioridade: critica
    workflow: AUTORESEARCH
    estimativa: "30min"
    data_conclusao: "2026-07-20"
    descricao: |
      Bug: "SQL logic error: ON CONFLICT clause does not match any PRIMARY KEY
      or UNIQUE constraint (1)" ao salvar cost tracking e knowledge records.
      Causa raiz: o binario gocat rodando (compilado 19/07 06:49) era anterior
      ao commit dfd5a25 (19/07 09:54) que corrigiu o schema do SQLite.
      O codigo fonte atual ja tem o fix (PRIMARY KEY (tenant, provider, model)
      + migrateTenantColumn). O banco fisico tambem tinha o PK correto.
      O problema era apenas o binario desatualizado em runtime.
    arquivos: ["pkg/knowledge/store.go"]
    implementacao: |
      1. Rebuild do binario: go build -o gocat_new ./cmd/gocat/
      2. Stop gocat antigo (PID 94529, binario de 19/07 06:49)
      3. Replace: mv gocat gocat_old_20260719; mv gocat_new gocat
      4. Reset banco: rm configs/knowledge.db (forcar schema fresco)
      5. Start novo gocat: ./gocat s --port 8080 --config configs/providers.yaml
      Validacao: 5 requests 200 OK, 0 WARN ON CONFLICT, /v1/costs retorna
      dados frescos (request_count=5, total_tokens=130, estimated_cost_usd=0).
    aceitacao:
      - "POST /v1/chat/completions salva cost record sem WARN"
      - "GET /v1/costs retorna dados frescos da simulacao v3"
      - "knowledge record salva sem WARN"
    validacao: "5/5 requests OK, 0 WARN, /v1/costs retorna {request_count:1, total_tokens:26, cost:0}"

  - id: 37
    titulo: "Capturar usage (tokens) na resposta do LLM"
    coluna: DONE
    prioridade: critica
    workflow: AUTORESEARCH
    estimativa: "20min"
    data_conclusao: "2026-07-20"
    descricao: |
      O campo usage vem na API response mas e ignorado.
      Adicionar captura de: usage.prompt_tokens, usage.completion_tokens,
      usage.total_tokens, e salvar no JSON de output por decisao.
    arquivos: ["simulation_army_v2/baseline.py", "simulation_army_v2/ensemble.py"]
    implementacao: |
      _call_model agora retorna tuple (DecisaoPersona, meta) onde meta contem
      prompt_tokens, completion_tokens, total_tokens do campo usage da API.
      kilocode_adapter extrai tokens do evento step_finish.part.tokens.
      devin_adapter retorna tokens=None (CLI nao expoe).
      ensemble.py salva metadados_modelos no JSON de output.
    aceitacao:
      - "DecisaoPersona tem campos: prompt_tokens, completion_tokens, total_tokens"
      - "JSON de output inclui tokens por decisao"
      - "Testes passam"
    validacao: "Run N=2 v4: gocat tokens=1000-2909, kilocode tokens=10000-17000, devin tokens=None"

  - id: 38
    titulo: "Capturar latencia, status HTTP e provider real por request"
    coluna: DONE
    prioridade: alta
    workflow: AUTORESEARCH
    estimativa: "20min"
    data_conclusao: "2026-07-20"
    descricao: |
      Medir duration_ms de cada chamada, status HTTP (200/503/429),
      e provider que realmente respondeu (gocat faz fallback).
      Salvar no JSON de output para analise de RPM e confiabilidade.
    arquivos: ["simulation_army_v2/baseline.py", "simulation_army_v2/ensemble.py"]
    implementacao: |
      _call_model mede latency_ms com time.monotonic(), captura http_status
      do response.status_code, e provider_used="gocat".
      kilocode_adapter e devin_adapter tambem medem latency_ms.
      metadados_modelos salvo no JSON do ensemble com latency, status, provider, source.
    aceitacao:
      - "DecisaoPersona tem campos: latency_ms, http_status, provider_used"
      - "JSON de output inclui metadados por decisao"
      - "Testes passam"
    validacao: "Run N=2 v4: latencias capturadas (gocat 1.5-150s, kilocode 13-70s, devin 10-54s)"

  - id: 39
    titulo: "Calcular custo em USD por modelo e por run"
    coluna: DONE
    prioridade: media
    workflow: AUTORESEARCH
    estimativa: "30min"
    data_conclusao: "2026-07-20"
    descricao: |
      Tabela de precos por modelo (USD por 1M tokens).
      Calcula custo = (prompt_tokens / 1M) * preco_in + (completion_tokens / 1M) * preco_out.
      Salva custo_total_usd e custo_por_modelo no JSON de output do ensemble.
    arquivos: ["simulation_army_v2/costs.py (novo)", "simulation_army_v2/ensemble.py", "tests_v2/test_costs.py (novo)"]
    implementacao: |
      costs.py: PRICING dict com 22 modelos (free=$0, paid=preco oficial).
      calculate_cost_usd(model, prompt_tokens, completion_tokens) -> float|None.
      calculate_run_cost(metadados_modelos) -> {custo_total_usd, custo_por_modelo}.
      ensemble.py: calcula custo total e por modelo, salva no JSON de output,
      imprime custo no stdout.
    aceitacao:
      - "Modulo costs.py com tabela de precos dos 22 modelos usados"
      - "JSON de output inclui custo_total_usd e custo_por_modelo"
      - "Testes passam"
    validacao: "11/11 testes test_costs.py passam, 123/123 testes totais passam"

  # --- FASE 2: DIVERSIFICACAO DE FONTES ---

  - id: 40
