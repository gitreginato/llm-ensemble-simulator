    arquivos: ["simulation_army_v2/kilocode_adapter.py (novo)"]
    implementacao: |
      kilocode_adapter.py: call_kilocode(model, user_prompt) -> (DecisaoPersona, meta).
      Chama `kilocode run -m <model> --format json <prompt>` via asyncio.subprocess.
      Parser _parse_kilocode_events extrai content de type=text, tokens de
      step_finish.part.tokens, cost de step_finish.part.cost, erro de type=error.
      Reusa _parse_json_response e DecisaoPersona do baseline.
