# Kanban: Observabilidade + Diversificacao do Simulation Army
# Criado: 2026-07-20
# Filosofia: capturar tudo que temos, expor tudo que falta, usar todos os CLIs disponiveis

# ============================================================
# COLUNA 1: INVENTARIO (o que temos vs o que nao temos)
# ============================================================

inventario:
  observabilidade:
    - dado: "Tokens por request"
      tem: SIM
      onde: "results_v2/*.json -> metadados_modelos[].total_tokens"
      estado: "Capturado em baseline.py (_call_model) e kilocode_adapter (step_finish)"
      acao: "DONE (task #37). devin_adapter retorna None (CLI nao expoe)."

    - dado: "Tokens por modelo"
      tem: PARCIAL
      onde: "/v1/costs (gocat) + results_v2/*.json (simulacao)"
      estado: "Simulacao captura tokens. Gocat /v1/costs ainda stale (bug SQLite #36)."
      acao: "fix-gocat-sqlite (task #36) para persistir no gocat tambem."

    - dado: "RPM (requests por minuto)"
      tem: PARCIAL
      onde: "results_v2/*.json -> metadados_modelos[].latency_ms"
      estado: "Latencia capturada. RPM derivavel de timestamp + n_requests."
      acao: "adicionar timestamp ISO por request no JSON (task futura)."

    - dado: "Latencia por request"
      tem: SIM
      onde: "results_v2/*.json -> metadados_modelos[].latency_ms"
      estado: "Capturado em _call_model, kilocode_adapter, devin_adapter."
      acao: "DONE (task #38)."

    - dado: "Status HTTP (200/503/429)"
      tem: SIM
      onde: "results_v2/*.json -> metadados_modelos[].http_status"
      estado: "Capturado em _call_model. kilocode/devin retornam 200 se OK."
      acao: "DONE (task #38)."

    - dado: "Decisoes das personas"
      tem: SIM
      onde: "results_v2/*.json -> decisoes_modelos[] + decisao_agregada"
      estado: "Salvo com metadados completos (tokens, latencia, status, provider, source)."
      acao: "DONE (tasks #37, #38)."

    - dado: "Prompt/completion tokens"
      tem: SIM
      onde: "results_v2/*.json -> metadados_modelos[].prompt_tokens/completion_tokens"
      estado: "Capturado do campo usage da API (gocat) e step_finish (kilocode)."
      acao: "DONE (task #37)."

    - dado: "Custo em USD"
      tem: PARCIAL
      onde: "results_v2/*.json -> metadados_modelos[].cost_usd (kilocode apenas)"
      estado: "kilocode_adapter captura cost do step_finish. gocat/devin retornam None."
      acao: "task #39: criar costs.py com tabela de precos para calcular custo gocat."

    - dado: "Provider real usado (fallback)"
      tem: PARCIAL
      onde: "results_v2/*.json -> metadados_modelos[].provider_used"
      estado: "provider_used='gocat'|'kilocode'|'devin'. Nao captura qual provider real do gocat fez fallback."
      acao: "task futura: capturar header X-Gocat-Provider se existir."

