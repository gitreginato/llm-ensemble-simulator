  # --- FASE 3: PADRAO DE CHAMADA ROUND-ROBIN ---

  - id: 44
    titulo: "Refatorar ensemble para round-robin por variavel (persona)"
    coluna: DONE
    prioridade: alta
    workflow: AUTORESEARCH
    estimativa: "30min"
    data_conclusao: "2026-07-20"
    descricao: |
      Atual: para cada persona, dispara todos os modelos em sequencia.
      Problema: mesmo provider recebe N requests seguidos -> rate limit.
      Solucao escolhida (ponytail): shuffle simples da ordem dos modelos
      a cada persona. Em vez de round-robin complexo, random.shuffle
      distribui a carga naturalmente entre providers.
    arquivos: ["simulation_army_v2/ensemble.py"]
    implementacao: |
      Antes do loop de modelos por persona, faz:
        models_this_persona = ensemble_models[:]
        random.shuffle(models_this_persona)
      Usa models_this_persona em vez de ensemble_models diretamente.
      random ja estava importado no ensemble.py.
    aceitacao:
      - "Ordem dos modelos varia por persona (shuffle)"
      - "Rate limit 503 reduzido comparado ao v3"
      - "Testes passam"
    validacao: "123/123 testes passam. Validacao real no run N=30 (task #47)."

  - id: 45
    titulo: "Adicionar delay adaptativo entre requests por provider"
    coluna: DONE
    prioridade: media
    workflow: AUTORESEARCH
    estimativa: "30min"
    data_conclusao: "2026-07-20"
    descricao: |
      Se source retorna 429/503, aumentar delay para essa source
      nas proximas chamadas (backoff). Se responde 200, resetar delay.
      Evita hammering em provider com rate limit ativo.
    arquivos: ["simulation_army_v2/ensemble.py"]
    implementacao: |
      source_backoff: dict[str, float] = {} antes do loop de personas.
      Antes de cada chamada: adaptive_delay = base_delay * source_backoff.get(source, 1.0).
      Se adaptive_delay > base_delay: asyncio.sleep(adaptive_delay - base_delay) extra.
      Apos sucesso: source_backoff[source] = 1.0 (reset).
      Apos falha: source_backoff[source] = min(backoff * 2.0, 8.0) (max 8x).
      Print mostra backoff atual quando falha: "FAIL ... (backoff=2.0x)".
    aceitacao:
      - "Delay por source ajustado dinamicamente"
      - "Source com 429/503 recebe delay 2x maior na proxima chamada"
      - "Testes passam"
    validacao: "123/123 testes passam. Validacao real no run N=30 (task #47)."

  # --- FASE 4: DASHBOARD DE OBSERVABILIDADE ---

  - id: 46
    titulo: "Criar dashboard de observabilidade da simulacao"
    coluna: DONE
    prioridade: media
    workflow: AUTORESEARCH
    estimativa: "1h"
    data_conclusao: "2026-07-20"
    descricao: |
      Dashboard HTML que le results_v2/*.json e mostra:
      - Tokens medios por modelo (bar chart SVG)
      - Latencia media por modelo (bar chart SVG)
      - Custo total por modelo (bar chart SVG)
      - Status OK vs FAIL por modelo (stacked bar SVG)
      - Confiabilidade por source (stacked bar SVG)
      - Tabela detalhada por modelo
      - Resumo dos runs (conversao, IC95, divergence, custo)
      Ponytail: SVG puro gerado por string formatting. Sem plotly, sem matplotlib,
      sem JS externo. HTML estatico abre em qualquer navegador.
    arquivos: ["scripts/dashboard_observability.py (novo)", "tests_v2/test_dashboard.py (novo)"]
    implementacao: |
      load_results(results_dir) -> list[dict]: le results_v2/*.json com "personas".
      aggregate_metrics(results) -> {by_model, by_source}: agrega por modelo e source.
      svg_bar_chart(title, data, color) -> str: bar chart SVG puro.
      svg_stacked_bar(title, data, color_ok, color_fail) -> str: stacked bar SVG.
      generate_html(results, metrics, output_path): gera dashboard.html completo.
      CLI: python scripts/dashboard_observability.py --results results_v2 --output dashboard.html
    aceitacao:
      - "dashboard.html gerado a partir de results_v2/*.json"
      - "Mostra todos os 6 graficos"
      - "Atualiza com novo JSON sem reprocessar tudo"
