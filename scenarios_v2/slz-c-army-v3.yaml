# Simulation Army v3 - Cenario SLZ-C
# Ensemble expandido: 11 modelos de 8 vendors distintos + 1 sintetizador.
# Diversidade cognitiva real: cada modelo tem um papel diferente.

scenario:
  code: SLZ-C-ARMY-V3
  name: "SLZ Seguranca Inteligente - Exercito de 11 IAs (8 vendors)"
  project: slz_n8n
  product_name: "Sistema de Seguranca Inteligente EMIVE"
  description: >
    Sistema de seguranca inteligente franquia EMIVE para lojas de roupas, calcados,
    acessorios e boutiques em Sao Luis, MA. Monitoramento 24h com central inviolavel
    e redundancia em 4 canais (Wi-Fi, ethernet, GPRS, linha telefonica). Sensores de
    vibracao nas vitrines e portas de aco, cameras com visao noturna colorida no caixa
    e provador, sirene de inibicao e atendimento humano via WhatsApp/ligacao.
    Foco na dor: lojista deixa estoque valioso fechado a noite, vitrine exposta.
    Visita tecnica gratuita de 15-20 minutos para avaliar layout da loja e montar
    proposta personalizada. Nao vendemos pelo WhatsApp sem visita.
    Conversao = agendamento da visita.
    Diferenciais: protecao de vitrine e estoque, cameras com IA, consultor local Reginato.
  price_brl: 1.00
  price_model: visit
  target_segment: loja_roupas
  channel: word_of_mouth
  value_proposition: "Protecao do estoque de vestuario contra arrombamentos noturnos nas portas de aco"
  pain_focus: "Estoque valioso fechado a noite, vitrine exposta, arrombamento"
  num_agents: 30

# Ensemble expandido: 11 modelos de 8 vendors distintos com papeis cognitivos.
# AI Council (Pith 2026): diversidade de vendors -> diversidade de treinamento -> diversidade de vies.
ensemble:
  models:
    # Cohere (2 modelos)
    - model: command-r-plus-08-2024
      provider: cohere
      role: conservador
      role_description: "Foca em risco tecnico, complexidade, confiabilidade"
    - model: command-a-03-2025
      provider: cohere
      role: estrategico
      role_description: "Foca em longo prazo, escalabilidade, parceria"
    # Groq (2 modelos)
    - model: llama-3.3-70b-versatile
      provider: groq
      role: conversacional
      role_description: "Foca em aspectos praticos, prova social, relacionamento"
    - model: qwen/qwen3.6-27b
      provider: groq
      role: tecnico
      role_description: "Foca em especificacoes, detalhes de implementacao"
    # Gemini (1 modelo)
    - model: gemini-2.5-flash
      provider: gemini
      role: analitico
      role_description: "Foca em dados, metricas, comparativos objetivos"
    # Nvidia (1 modelo)
    - model: deepseek-ai/deepseek-v4-flash
      provider: nvidia
      role: pragmatico
      role_description: "Foca em viabilidade financeira, orcamento, ROI"
    # SambaNova (1 modelo)
    - model: Meta-Llama-3.3-70B-Instruct
      provider: sambanova
      role: cetico
      role_description: "Foca em objecoes, riscos ocultos, armadilhas"
    # Kilo (2 modelos)
    - model: tencent/hy3:free
      provider: kilo
      role: financeiro
      role_description: "Foca em custos, TCO, retorno sobre investimento"
    - model: kilo-auto/free
      provider: kilo
      role: otimista
      role_description: "Foca em oportunidades, crescimento, beneficios"
    # SiliconFlow (1 modelo)
    - model: deepseek-ai/DeepSeek-V3
      provider: siliconflow
      role: realista
      role_description: "Foco em cenario mais provavel, nem otimista nem pessimista"

# Sintetizador de consenso: command-a-03-2025 (Cohere frontier).
# Council Mode (arXiv 2604.02923): sintese estruturada supera votacao majoritaria.
synthesizer:
  model: command-a-03-2025
  provider: cohere

# Benchmark de calibracao (evidencia nivel B, web_search 2026-07-19).
benchmark:
  conversao_geral_min: 0.02
  conversao_geral_max: 0.08
  agendamento_min: 0.01
  agendamento_max: 0.08
  whatsapp_reply_min: 0.10
  whatsapp_reply_max: 0.20
  fontes:
    - "Sirius CRM Anuario 2026: conversao lead->cliente Brasil media 8%, saudavel 2-5%"
    - "PowerGO 2026: exemplo B2B 6.5% conversao geral"
    - "Touchstone BPO 2026: contact-to-meeting 4-10% (SaaS/B2B tech)"
    - "StealthAgents 2026: cold call->appointment 1-3% unoptimized, 4-8% optimized"
    - "eesier 2026: WhatsApp positive reply 10-20%, meeting rate 1-3%"
    - "ORRJO 2026: meeting booked per outreach 0.5-1.2% average, 1.5-2.5% good"

# Gocat gateway
gocat:
  base_url: "http://127.0.0.1:8080"
  api_key_env: GOCAT_API_KEY
  api_key_default: local-dev-key-change-me
  timeout_seconds: 30
  max_retries: 2

# Parametros de execucao
execution:
  seeds: [42]
  delay_between_personas_seconds: 1.0
  delay_between_models_seconds: 0.3
